name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/LiteBrowser-debug.apk
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteBrowser-debug-apk
          path: out/LiteBrowser-debug.apk
          if-no-files-found: error

      # 把最新安装包挂到一个固定 release 上，方便手机直接下载安装
      - name: Publish to release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest out/LiteBrowser-debug.apk --clobber
          else
            gh release create latest \
              --title "LiteBrowser 最新构建" \
              --notes "由 GitHub Actions 自动构建的安装包（debug 签名，可直接侧载安装）。每次推送 main 分支自动更新。" \
              out/LiteBrowser-debug.apk
          fi
